<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#bfe5df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ぽんぽこの森" />
    <meta name="description" content="たぬきと農園・動物・ひらがな・ABCで遊ぶ、iPad向け知育ゲーム。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>ぽんぽこ もりの だいぼうけん</title>
  </head>
  <body>
    <main id="app" class="app" data-screen="home">
      <section id="home-screen" class="screen home-screen is-active" aria-labelledby="app-title">
        <div class="home-scenery" aria-hidden="true">
          <span class="sun"></span><span class="cloud cloud-a"></span><span class="cloud cloud-b"></span>
          <span class="hill hill-a"></span><span class="hill hill-b"></span>
          <span class="tree tree-a"></span><span class="tree tree-b"></span>
        </div>

        <header class="home-header">
          <div class="logo-lockup">
            <span class="logo-leaf" aria-hidden="true"></span>
            <div><p>たぬきと いっしょに</p><h1 id="app-title">ぽんぽこ もりの だいぼうけん</h1></div>
          </div>
          <button class="adult-button" id="adult-button" type="button" aria-label="保護者メニューを開く"><span aria-hidden="true">⚙</span><small>おとな</small></button>
        </header>

        <div class="home-content">
          <div class="home-guide" aria-hidden="true">
            <div id="home-tanuki" class="home-tanuki tanuki-sprite pose-wave"></div>
            <div class="home-guide-bubble"><span>どれで<br />あそぶ？</span></div>
          </div>
          <nav class="mode-menu" aria-label="あそびを選ぶ">
            <button class="mode-card mode-farm" type="button" data-mode="farm" aria-label="ぽんぽこ農園で遊ぶ">
              <span class="mode-art farm-art" aria-hidden="true"><i class="world-sprite cell-apple"></i><i class="world-sprite cell-carrot"></i></span>
              <strong>のうえん</strong><small>とって はこぶ</small>
            </button>
            <button class="mode-card mode-animal" type="button" data-mode="animal" aria-label="どうぶつ広場で遊ぶ">
              <span class="mode-art animal-art" aria-hidden="true"><i class="world-sprite cell-dog"></i><i class="world-sprite cell-elephant"></i></span>
              <strong>どうぶつ</strong><small>おなじを みつける</small>
            </button>
            <button class="mode-card mode-hiragana" type="button" data-mode="hiragana" aria-label="ひらがなの音で遊ぶ">
              <span class="mode-art letter-art" aria-hidden="true">あ</span>
              <strong>ひらがな</strong><small>きいて はこぶ</small>
            </button>
            <button class="mode-card mode-alphabet" type="button" data-mode="alphabet" aria-label="アルファベットの音で遊ぶ">
              <span class="mode-art letter-art alphabet-art" aria-hidden="true">A<span>a</span></span>
              <strong>ABC</strong><small>きいて はこぶ</small>
            </button>
          </nav>
        </div>
      </section>

      <section id="game-screen" class="screen game-screen" aria-label="知育あそび">
        <div id="game-backdrop" class="game-backdrop" aria-hidden="true">
          <span class="sun"></span><span class="cloud cloud-a"></span><span class="cloud cloud-b"></span>
          <span class="hill hill-a"></span><span class="hill hill-b"></span>
        </div>
        <header class="game-hud">
          <button class="hud-button" id="game-home-button" type="button" aria-label="あそびを選ぶ画面にもどる"><span aria-hidden="true">⌂</span></button>
          <div class="mode-progress" aria-live="polite">
            <span id="mode-icon" class="mode-icon">●</span>
            <div><strong id="mode-title">ぽんぽこ農園</strong><span id="round-pips" class="round-pips"></span></div>
          </div>
          <button class="hud-button" id="game-adult-button" type="button" aria-label="保護者メニューを開く"><span aria-hidden="true">⚙</span></button>
        </header>

        <div id="activity-layer" class="activity-layer"></div>
        <div id="tanuki-actor" class="tanuki-actor tanuki-sprite pose-wave" aria-label="いっしょに遊ぶたぬき"></div>
        <div id="tanuki-reaction" class="tanuki-reaction" aria-hidden="true"><span>♥</span></div>
        <div id="gesture-hint" class="gesture-hint" aria-hidden="true"><i></i></div>
        <div id="particle-layer" class="particle-layer" aria-hidden="true"></div>

        <div id="round-complete" class="round-complete" hidden>
          <div class="complete-glow" aria-hidden="true"></div>
          <button id="next-round-button" class="next-round-button" type="button" aria-label="次へ進む"><span aria-hidden="true">▶</span><strong>つぎへ</strong></button>
        </div>

        <div id="activity-curtain" class="activity-curtain" hidden>
          <div id="curtain-demo" class="curtain-demo" aria-hidden="true"></div>
          <strong id="curtain-title">ぽんぽこ農園</strong>
          <div class="curtain-tanuki tanuki-sprite pose-wave" aria-hidden="true"></div>
        </div>
      </section>

      <section id="finish-screen" class="screen finish-screen" aria-labelledby="finish-title">
        <div class="finish-scenery" aria-hidden="true"><span class="sun"></span><span class="finish-hill"></span><div class="finish-carpet"></div></div>
        <div id="finish-results" class="finish-results" aria-hidden="true"></div>
        <div class="finish-tanuki tanuki-sprite pose-jump" aria-hidden="true"></div>
        <div class="finish-copy"><p id="finish-kicker">ぽんぽこ ぽーん！</p><h2 id="finish-title">できたね！</h2></div>
        <button class="replay-button" id="replay-button" type="button"><span aria-hidden="true">↻</span><strong>もういっかい</strong></button>
        <button class="finish-home-button" id="finish-home-button" type="button">ほかの あそび</button>
        <div id="finish-confetti" class="finish-confetti" aria-hidden="true"></div>
      </section>
    </main>

    <dialog id="parent-dialog" class="parent-dialog" aria-labelledby="parent-title">
      <div class="dialog-surface">
        <button class="dialog-close" id="dialog-close" type="button" aria-label="閉じる">×</button>
        <section id="parent-gate">
          <p class="dialog-kicker">おとなの方へ</p><h2 id="parent-title">保護者メニュー</h2>
          <p>誤操作を防ぐため、答えを選んでください。</p>
          <div class="gate-question">2 ＋ 3 ＝ ?</div>
          <div class="gate-options"><button type="button" data-gate="4">4</button><button type="button" data-gate="5">5</button><button type="button" data-gate="6">6</button></div>
          <p id="gate-feedback" class="gate-feedback" aria-live="polite"></p>
        </section>
        <section id="parent-settings" hidden>
          <p class="dialog-kicker">おとなの方へ</p><h2>遊びかたの設定</h2>
          <div class="session-summary"><span>できた あそび</span><strong id="session-count">0回</strong></div>
          <label class="setting-row"><span><strong>やさしい効果音</strong><small>収穫・移動・成功に合った短い音を鳴らします</small></span><input id="effects-setting" type="checkbox" checked /></label>
          <label class="setting-row"><span><strong>ことばの音声</strong><small>物の名前、ひらがな、ABCを日本語・英語で発音します</small></span><input id="voice-setting" type="checkbox" checked /></label>
          <label class="setting-row"><span><strong>動きをひかえめに</strong><small>大きな移動や紙吹雪を少なくします</small></span><input id="motion-setting" type="checkbox" /></label>
          <div class="parent-note"><strong>今回の知育設計</strong><p>自然な場所から収穫する、動物と影を合わせる、文字の形と音を結び付ける4つの遊びです。間違えても減点せず、対象は完成まで画面に残ります。</p></div>
          <button class="reset-button" id="reset-button" type="button">記録をリセット</button>
        </section>
      </div>
    </dialog>

    <noscript>このあそびにはJavaScriptが必要です。Safariの設定をご確認ください。</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
